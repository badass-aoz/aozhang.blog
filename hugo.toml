baseURL = 'https://aozhang.blog/'
locale = 'en-us'
title = '野文 | Follow the Skyline'
theme = 'PaperMod'
hasCJKLanguage = true
enableRobotsTXT = true

[pagination]
  pagerSize = 15

[outputs]
  home = ['HTML', 'RSS', 'JSON']

[permalinks]
  [permalinks.page]
    posts = '/posts/:slug/'

[taxonomies]
  category = 'categories'
  tag = 'tags'

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
  [markup.highlight]
    noClasses = false

[params]
  env = 'production'
  author = 'Ao Zhang'
  description = 'Follow the Skyline | 野文 — Essays on macroeconomics, investing, technology, climbing, and life.'
  mainSections = ['posts']
  defaultTheme = 'auto'
  disableThemeToggle = false
  ShowReadingTime = true
  ShowWordCount = true
  ShowPostNavLinks = true
  ShowBreadCrumbs = true
  ShowCodeCopyButtons = true
  ShowRssButtonInSectionTermList = true
  ShowToc = true
  TocOpen = false
  ShowShareButtons = false
  comments = true

  [params.homeInfoParams]
    Title = '野文 · Follow the Skyline'
    Content = 'Essays on macroeconomics, investing, technology, alpine climbing, books, and life — written in Chinese and English.'

  [[params.socialIcons]]
    name = 'github'
    url = 'https://github.com/badass-aoz'

  [[params.socialIcons]]
    name = 'rss'
    url = '/index.xml'

  [params.fuseOpts]
    isCaseSensitive = false
    shouldSort = true
    location = 0
    distance = 1000
    threshold = 0.2
    minMatchCharLength = 2
    limit = 20
    keys = ['title', 'permalink', 'summary', 'content']

  [params.waline]
    serverURL = 'https://aozhang-blog-waline.vercel.app'
    reaction = true
    pageview = false
    turnstileKey = ''
    placeholder = 'Leave a comment (no login required) / 欢迎留言（无需登录）...'

[[menu.main]]
  identifier = 'posts'
  name = 'Posts'
  url = '/posts/'
  weight = 10

[[menu.main]]
  identifier = 'categories'
  name = 'Categories'
  url = '/categories/'
  weight = 20

[[menu.main]]
  identifier = 'tags'
  name = 'Tags'
  url = '/tags/'
  weight = 30

[[menu.main]]
  identifier = 'archives'
  name = 'Archives'
  url = '/archives/'
  weight = 40

[[menu.main]]
  identifier = 'search'
  name = 'Search'
  url = '/search/'
  weight = 50

[[menu.main]]
  identifier = 'contact'
  name = 'Contact'
  url = '/contact/'
  weight = 60
